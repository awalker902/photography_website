    .project-container.full-mode .sidebar {

    .toggle-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 1.2rem;
        padding: 5px;
        transition: color 0.2s;
    }
    
     
    .close-sidebar {
        position: absolute;
        top: 15px;
        right: 15px;  
        z-index: 10;
        
         
        background: rgba(0,0,0,0.2);
        border-radius: 4px;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
    }
    
    .close-sidebar:hover {
        background: var(--text-main);
        color: var(--bg-dark);
    }

     
    .open-sidebar {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 100;
        display: none;  
        background: rgba(0,0,0,0.5);  
        padding: 10px;
        border-radius: 4px;
    }

    .project-container.full-mode .open-sidebar {
        display: block;
    }

     
    .stage-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0,0,0,0.3);  
        color: white;
        border: none;
        font-size: 2rem;
        padding: 15px;
        cursor: pointer;
        z-index: 90;
        border-radius: 50%;  
        width: 60px; height: 60px;
        display: flex; align-items: center; justify-content: center;
        
        opacity: 0;  
        transition: opacity 0.3s, background 0.3s;
    }

     
    .stage:hover .stage-nav {
        opacity: 1;
    }

     
    @media (max-width: 768px) {
        .stage-nav { display: none; }

<script>
    let currentIndex = 0;
    const slides = document.querySelectorAll('.slide');
    const captionTarget = document.getElementById('caption-target');
    const counterTarget = document.getElementById('counter-target');

    
    function formatNumber(num) {
        return num.toString().padStart(2, '0');
    }

    function updateUI() {
        
        if(captionTarget && slides[currentIndex]) {
            captionTarget.innerText = slides[currentIndex].getAttribute('data-title');
        }
        
        
        if(counterTarget) {
            const currentStr = formatNumber(currentIndex + 1);
            const totalStr = formatNumber(slides.length);
            counterTarget.innerText = `${currentStr} / ${totalStr}`;
        }
    }

    
    if(slides.length > 0) {
        updateUI();
    }

    function changeSlide(direction) {
        slides[currentIndex].classList.remove('active');
        
        currentIndex += direction;

        
        if (currentIndex >= slides.length) currentIndex = 0;
        if (currentIndex < 0) currentIndex = slides.length - 1;

        slides[currentIndex].classList.add('active');
        
        updateUI();
    }
    
    document.addEventListener('keydown', function(e) {
        if(e.key === "ArrowRight") changeSlide(1);
        if(e.key === "ArrowLeft") changeSlide(-1);
    });

    function toggleSidebar() {
        const container = document.querySelector('.project-container');
        container.classList.toggle('full-mode');
        
        
        window.dispatchEvent(new Event('resize'));
    }

    
    let touchStartX = 0;
    let touchEndX = 0;
    const stage = document.querySelector('.stage');

    stage.addEventListener('touchstart', function(e) {
        
        touchStartX = e.changedTouches[0].screenX;
    }, {passive: true});

    stage.addEventListener('touchend', function(e) {
        
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    }, {passive: true});

    function handleSwipe() {
        
        const threshold = 50; 
        const diff = touchEndX - touchStartX;

        if (Math.abs(diff) > threshold) {
            if (diff < 0) {
                
                changeSlide(1);
            } else {
                
                changeSlide(-1);
            }
        }
    }
    
</script>
