<!DOCTYPE html>
<html lang="en">
<head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
         
        :root {
            --bg-dark: #0f1216;       
            --bg-panel: #161b22;      
            --bg-stage: #0a0c0f;      
            --text-main: #e6edf3;     
            --text-muted: #8b949e;    
            --border: #30363d;        
        }

        body { 
            font-family: 'Bitter', serif; 
            margin: 0; 
            background-color: var(--bg-dark);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }
        
         
        nav { 
            padding: 1.5rem 2.5rem;
            border-bottom: 1px solid var(--border); 
            display: flex;
            gap: 30px;
            background-color: var(--bg-dark);
        }
        
        nav a {
            text-decoration: none;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.85rem;
            font-weight: 700;
            transition: color 0.2s;
        }

        nav a:hover { color: var(--text-main); }
        
         
        footer {
            padding: 1.5rem 2.5rem;
            font-size: 0.8rem;
            color: var(--border); 
            border-top: 1px solid var(--border);
            text-align: right;
            background-color: var(--bg-dark);
        }

        a { color: var(--text-main); }
    </style>
</head>
<body>
    
    <nav>
        <a href="/" style="color: var(--text-main);">Alex Walker</a>
        <a href="/projects">Projects</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a> </nav>

    <main>
        
<article style="max-width: 800px; margin: 0 auto; padding: 80px 20px;">
    
    <header style="margin-bottom: 50px; border-bottom: 1px solid var(--border); padding-bottom: 30px;">
        <h1 style="font-size: 3rem; line-height: 1.1; margin-bottom: 10px;">Contact</h1>
    </header>

    <div style="font-size: 1.2rem; line-height: 1.7; color: var(--text-main);">
        <style>
    /* Darkroom Form Styling */
    .contact-form {
        max-width: 500px;
        margin-top: 40px;
    }

    .form-group {
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-weight: 700;
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        background-color: var(--bg-panel); /* Dark Grey */
        border: 1px solid var(--border);
        color: var(--text-main);
        font-family: 'Bitter', serif; /* Matching your site font */
        font-size: 1rem;
        box-sizing: border-box;
        transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
        outline: none;
        border-color: var(--text-main); /* Light up on focus */
    }

    button[type="submit"] {
        background-color: transparent;
        color: var(--text-main);
        border: 1px solid var(--text-main);
        padding: 12px 30px;
        font-family: 'Bitter', serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        transition: all 0.3s;
    }

    button[type="submit"]:hover {
        background-color: var(--text-main);
        color: var(--bg-dark);
    }
</style>
<div class="contact-text">
    <p>To reach me, please shoot me an email using the form below:</p>
</div>
<form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="contact-form">
<p style="display:none">
    <label>Don’t fill this out if you're human: <input name="bot-field" /></label>
</p>
<div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required />
</div>
<div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required />
</div>
<div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" required></textarea>
</div>
<p><button type="submit">Send Message</button></p>
</form>
    </div>

</article>

    </main>

    <footer>
        <p>&copy; 2026 Alex Walker</p>
    </footer>

</body>
</html>
